services:
  postgres:
    image: postgres:17
    container_name: barber-postgres
    environment:
      POSTGRES_DB: barber
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber_dev
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - barber_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber -d barber"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: barber-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/barber
      DB_USERNAME: barber
      DB_PASSWORD: barber_dev
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_INITIAL_ADMIN_USERNAME: admin@barbearia.com
      APP_INITIAL_ADMIN_PASSWORD: admin12345
      APP_INITIAL_ADMIN_NAME: Administrador
      APP_DEMO_DATA: "true"
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"

volumes:
  barber_pgdata:
