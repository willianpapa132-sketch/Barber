services:
  postgres:
    image: postgres:17
    container_name: barber-postgres
    environment:
      POSTGRES_DB: barber
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber_dev
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - barber_pgdata:/var/lib/postgresql/data

volumes:
  barber_pgdata:
