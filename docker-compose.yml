services:
  postgres:
    image: postgres:17
    container_name: barber-postgres
    environment:
      POSTGRES_DB: barber
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber_dev
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - barber_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber -d barber"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: barber-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/barber
      DB_USERNAME: barber
      DB_PASSWORD: barber_dev
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      APP_MULTITENANCY_ENABLED: ${APP_MULTITENANCY_ENABLED:-false}
      APP_PLATFORM_HOST: ${APP_PLATFORM_HOST:-localhost}
      APP_TENANT_BASE_DOMAIN: ${APP_TENANT_BASE_DOMAIN:-localhost}
      APP_TENANT_ENCRYPTION_KEY: ${APP_TENANT_ENCRYPTION_KEY:-}
      APP_PLATFORM_ADMIN_LOGIN: ${APP_PLATFORM_ADMIN_LOGIN:-}
      APP_PLATFORM_ADMIN_PASSWORD: ${APP_PLATFORM_ADMIN_PASSWORD:-}
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"

volumes:
  barber_pgdata:
