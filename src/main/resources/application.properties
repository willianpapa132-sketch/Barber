spring.application.name=Barber
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barber}
spring.datasource.username=${DB_USERNAME:barber}
spring.datasource.password=${DB_PASSWORD:barber_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.flyway.enabled=true

spring.thymeleaf.cache=false

app.zone=America/Sao_Paulo
app.initial-admin.username=${APP_INITIAL_ADMIN_USERNAME:}
app.initial-admin.password=${APP_INITIAL_ADMIN_PASSWORD:}
app.initial-admin.name=${APP_INITIAL_ADMIN_NAME:Administrador}
app.demo-data=${APP_DEMO_DATA:false}
