spring.application.name=Barbearia
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barber}
spring.datasource.username=${DB_USERNAME:barber}
spring.datasource.password=${DB_PASSWORD:barber_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.thymeleaf.cache=false

app.zone=America/Sao_Paulo

app.multi-tenancy.enabled=${APP_MULTITENANCY_ENABLED:false}
app.multi-tenancy.platform-host=${APP_PLATFORM_HOST:localhost}
app.multi-tenancy.base-domain=${APP_TENANT_BASE_DOMAIN:localhost}
app.multi-tenancy.encryption-key=${APP_TENANT_ENCRYPTION_KEY:}
app.multi-tenancy.owner-login=${APP_PLATFORM_ADMIN_LOGIN:}
app.multi-tenancy.owner-password=${APP_PLATFORM_ADMIN_PASSWORD:}
# O proxy deve preservar Host. Cabecalhos Forwarded nao identificam empresas.
server.forward-headers-strategy=none
