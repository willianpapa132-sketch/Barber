<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barbeiros</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header><a href="/admin">Painel</a></header><main class="wrap"><h1>Barbeiros</h1><p class="ok" th:if="${sucesso}" th:text="${sucesso}"></p><p class="err" th:if="${erro}" th:text="${erro}"></p>
<form method="post" th:action="@{/admin/barbeiros}" th:object="${form}" class="panel"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="grid"><div><label>Nome</label><input th:field="*{nome}" required></div><div><label>Telefone</label><input th:field="*{telefone}" required></div><div><label>Usuário</label><input th:field="*{username}" required></div><div><label>Senha</label><input th:field="*{password}" type="password" required minlength="8"></div></div><label>Serviços executados</label><label th:each="s:${servicos}" class="slot"><input type="checkbox" name="serviceIds" th:value="${s.id}"><span th:text="${s.nome}"></span></label><button>Salvar barbeiro</button></form>
<table><tr><th>Nome</th><th>Telefone</th><th>Usuário</th><th>Serviços</th><th>Ativo</th></tr><tr th:each="b:${barbeiros}"><td th:text="${b.nome}"></td><td th:text="${b.telefone}"></td><td th:text="${b.user.username}"></td><td><span th:each="s:${b.services}" th:text="${s.nome+' '}"></span></td><td th:text="${b.active?'Sim':'Não'}"></td></tr></table></main></body></html>
