<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serviços</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header><a href="/admin">Painel</a></header><main class="wrap"><h1>Serviços</h1><p class="ok" th:if="${sucesso}" th:text="${sucesso}"></p>
<form method="post" th:action="@{/admin/servicos}" th:object="${form}" class="panel"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="grid"><div><label>Nome</label><input th:field="*{nome}" required></div><div><label>Preço</label><input th:field="*{preco}" type="number" step="0.01" min="0" required></div><div><label>Duração</label><input th:field="*{duracaoMinutos}" type="number" min="1" required></div></div><label>Descrição</label><textarea th:field="*{descricao}"></textarea><button>Salvar</button></form>
<table><tr><th>Nome</th><th>Preço</th><th>Duração</th><th>Ativo</th><th>Ação</th></tr><tr th:each="s:${servicos}"><td th:text="${s.nome}"></td><td th:text="${'R$ '+#numbers.formatDecimal(s.preco,1,'POINT',2,'COMMA')}"></td><td th:text="${s.duracaoMinutos+' min'}"></td><td th:text="${s.active?'Sim':'Não'}"></td><td><form class="inline" method="post" th:action="@{/admin/servicos/{id}(id=${s.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="nome" th:value="${s.nome}"><input type="hidden" name="descricao" th:value="${s.descricao}"><input type="hidden" name="preco" th:value="${s.preco}"><input type="hidden" name="duracaoMinutos" th:value="${s.duracaoMinutos}"><input type="hidden" name="active" th:value="${!s.active}"><button th:text="${s.active?'Desativar':'Ativar'}"></button></form></td></tr></table></main></body></html>
