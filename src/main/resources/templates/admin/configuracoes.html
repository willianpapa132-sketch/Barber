<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header><a href="/admin">Painel</a></header><main class="wrap"><h1>Configurações da barbearia</h1><p class="ok" th:if="${sucesso}" th:text="${sucesso}"></p>
<form class="panel" method="post" th:action="@{/admin/configuracoes}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="grid"><div><label>Nome</label><input name="nome" th:value="${config.nome}" required></div><div><label>Telefone</label><input name="telefone" th:value="${config.telefone}"></div><div><label>Endereço</label><input name="endereco" th:value="${config.endereco}"></div><div><label>Antecedência mínima em minutos</label><input type="number" min="0" name="minAntecedenciaMinutos" th:value="${config.minAntecedenciaMinutos}"></div><div><label>Horizonte de agendamento em dias</label><input type="number" min="1" name="horizonteDias" th:value="${config.horizonteDias}"></div></div><button>Salvar</button></form>
<p class="muted">Horários de funcionamento e jornadas profissionais são persistidos no banco; nesta versão a tela administrativa cria uma jornada padrão ao cadastrar barbeiro.</p></main></body></html>
