<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<header><div class="topnav"><nav><a href="/admin">Painel</a><a href="/admin/servicos">Serviços</a><a href="/admin/barbeiros">Barbeiros</a><a href="/admin/clientes">Clientes</a><a href="/admin/agenda">Agenda</a><a href="/admin/caixa">Caixa</a><a href="/admin/relatorios">Relatórios</a><a href="/admin/configuracoes">Configurações</a></nav><form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="secondary">Sair</button></form></div></header>
<main class="wrap"><h1>Painel administrativo</h1><div class="grid"><div class="card"><h2 th:text="${concluidos}">0</h2><p>Concluídos hoje</p></div><div class="card"><h2 th:text="${cancelados}">0</h2><p>Cancelados hoje</p></div><div class="card"><h2 th:text="${faltas}">0</h2><p>Faltas hoje</p></div></div><h2>Agendamentos do dia</h2><table><tr><th>Horário</th><th>Cliente</th><th>Serviço</th><th>Status</th></tr><tr th:each="a:${agendaHoje}"><td th:text="${#temporals.format(a.startAt,'HH:mm')}"></td><td th:text="${a.customerName}"></td><td th:text="${a.serviceNameSnapshot}"></td><td th:text="${a.status}"></td></tr></table></main></body></html>
