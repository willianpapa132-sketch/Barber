<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caixa</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header><a href="/admin">Painel</a></header><main class="wrap"><h1>Caixa</h1><p class="ok" th:if="${sucesso}" th:text="${sucesso}"></p><p class="err" th:if="${erro}" th:text="${erro}"></p>
<section class="panel" th:if="${open==null}"><h2>Abrir caixa</h2><form method="post" th:action="@{/admin/caixa/abrir}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Saldo inicial em dinheiro</label><input name="dinheiroInicial" type="number" step="0.01" min="0" required><button>Abrir</button></form></section>
<section th:if="${open!=null}"><div class="panel"><h2>Caixa aberto</h2><p>Saldo inicial: <strong th:text="${'R$ '+#numbers.formatDecimal(open.dinheiroInicial,1,'POINT',2,'COMMA')}"></strong></p></div>
<div class="grid"><form class="panel" method="post" th:action="@{/admin/caixa/receber}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><h2>Receber atendimento</h2><label>Atendimento concluído</label><select name="agendamentoId" required><option th:each="a:${pendentes}" th:value="${a.id}" th:text="${a.nomeCliente+' - '+a.nomeServicoSnapshot+' - R$ '+#numbers.formatDecimal(a.precoServicoSnapshot,1,'POINT',2,'COMMA')}"></option></select><label>Forma</label><select name="formaPagamentoAgendamento" required><option th:each="m:${formaPagamentos}" th:value="${m}" th:text="${m}"></option></select><button>Registrar</button></form>
<form class="panel" method="post" th:action="@{/admin/caixa/movimento}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><h2>Movimento manual</h2><label>Tipo</label><select name="type"><option value="ENTRADA_MANUAL">Entrada</option><option value="SAIDA_MANUAL">Saída</option><option value="SUPRIMENTO">Suprimento</option><option value="SANGRIA">Sangria</option></select><label>Valor</label><input name="valor" type="number" step="0.01" min="0.01" required><label>Descrição</label><input name="descricao" required><label>Categoria</label><input name="categoria"><button>Registrar</button></form></div>
<h2>Movimentações</h2><table><tr><th>Data</th><th>Tipo</th><th>Forma</th><th>Valor</th><th>Descrição</th><th>Estorno</th></tr><tr th:each="m:${movimentos}"><td th:text="${#temporals.format(m.criadoEm,'dd/MM HH:mm')}"></td><td th:text="${m.type}"></td><td th:text="${m.formaPagamentoAgendamento}"></td><td th:text="${'R$ '+#numbers.formatDecimal(m.valor,1,'POINT',2,'COMMA')}"></td><td th:text="${m.descricao}"></td><td><form th:if="${!m.estornado && m.type.name()!='ESTORNO'}" class="inline" method="post" th:action="@{/admin/caixa/estornar/{id}(id=${m.id})}" onsubmit="return confirm('Confirmar estorno?')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="reason" placeholder="Motivo" required><button class="danger">Estornar</button></form></td></tr></table>
<form class="panel" method="post" th:action="@{/admin/caixa/fechar}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><h2>Fechar caixa</h2><label>Dinheiro contado</label><input name="dinheiroContado" type="number" step="0.01" min="0" required><button>Fechar</button></form></section></main></body></html>
