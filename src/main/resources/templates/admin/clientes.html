<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header><a href="/admin">Painel</a></header><main class="wrap"><h1>Clientes</h1><p class="ok" th:if="${sucesso}" th:text="${sucesso}"></p><p class="err" th:if="${erro}" th:text="${erro}"></p>
<form method="get" class="actions"><input name="q" th:value="${q}" placeholder="Pesquisar por nome ou telefone"><button>Pesquisar</button></form>
<form method="post" th:action="@{/admin/clientes}" th:object="${form}" class="panel"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="grid"><div><label>Nome</label><input th:field="*{nome}" required></div><div><label>Telefone</label><input th:field="*{telefone}" required></div><div><label>Login</label><input th:field="*{login}" maxlength="80"></div><div><label>Senha</label><input type="password" th:field="*{password}" maxlength="120"></div></div><button>Salvar cliente</button></form>
<table><tr><th>Nome</th><th>Telefone</th><th>Usuario</th></tr><tr th:each="c:${clientes}"><td th:text="${c.nome}"></td><td th:text="${c.telefone}"></td><td th:text="${c.usuario != null ? c.usuario.login : '-'}"></td></tr></table></main></body></html>
