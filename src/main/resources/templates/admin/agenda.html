<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header><a href="/admin">Painel</a></header><main class="wrap"><h1>Agenda</h1><p class="ok" th:if="${sucesso}" th:text="${sucesso}"></p><p class="err" th:if="${erro}" th:text="${erro}"></p>
<form method="get" class="actions"><input type="date" name="data" th:value="${data}"><select name="barbeiroId"><option value="">Todos</option><option th:each="b:${barbeiros}" th:value="${b.id}" th:text="${b.nome}"></option></select><button>Filtrar</button></form>
<form method="post" th:action="@{/admin/agenda}" th:object="${form}" class="panel"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="grid"><div><label>Cliente</label><input th:field="*{nomeCliente}" required></div><div><label>Telefone</label><input th:field="*{telefoneCliente}" required></div><div><label>Servico</label><select th:field="*{servicoId}" required><option th:each="s:${servicos}" th:value="${s.id}" th:text="${s.nome}"></option></select></div><div><label>Barbeiro</label><select th:field="*{barbeiroId}" required><option th:each="b:${barbeiros}" th:value="${b.id}" th:text="${b.nome}"></option></select></div><div><label>Data</label><input type="date" th:field="*{data}" required></div><div><label>Horario</label><input type="time" step="900" th:field="*{hora}" required></div></div><button>Criar agendamento</button></form>
<table><tr><th>Inicio</th><th>Fim</th><th>Cliente</th><th>Barbeiro</th><th>Servico</th><th>Plano</th><th>Status</th><th>Acoes</th></tr><tr th:each="a:${agendamentos}"><td th:text="${#temporals.format(a.inicioEm,'dd/MM HH:mm')}"></td><td th:text="${#temporals.format(a.fimEm,'HH:mm')}"></td><td th:text="${a.nomeCliente}"></td><td th:text="${a.barber.nome}"></td><td th:text="${a.nomeServicoSnapshot}"></td><td th:text="${a.planoMensal == null ? '-' : 'Mensal'}"></td><td th:text="${a.status}"></td><td><form class="inline" method="post" th:action="@{/admin/agenda/{id}/status(id=${a.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="status"><option value="CONCLUIDO">Concluir</option><option value="CANCELADO">Cancelar</option><option value="NAO_COMPARECEU">Falta</option></select><button>Aplicar</button></form></td></tr></table></main></body></html>
