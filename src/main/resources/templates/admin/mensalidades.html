<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mensalidades</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header><a href="/admin">Painel</a></header>
<main class="wrap"><h1>Mensalidades</h1><p class="ok" th:if="${sucesso}" th:text="${sucesso}"></p><p class="err" th:if="${erro}" th:text="${erro}"></p>
<h2>Planos por barbeiro</h2><div class="grid"><form class="card" th:each="b:${barbeiros}" th:with="cfg=${configuracoesPorBarbeiro[b.id]}" method="post" th:action="@{/admin/mensalidades/barbeiros/{id}(id=${b.id})}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><h3 th:text="${b.nome}">Barbeiro</h3>
<div class="grid"><div><label>Valor mensal</label><input name="valorMensal" type="number" min="0" step="0.01" th:value="${cfg == null ? '0.00' : cfg.valorMensal}" required></div><div><label>Cortes por mes</label><input name="cortesPorMes" type="number" min="1" th:value="${cfg == null ? 4 : cfg.cortesPorMes}" required></div><div><label>Cortes por semana</label><input name="cortesPorSemana" type="number" min="1" th:value="${cfg == null ? 1 : cfg.cortesPorSemana}" required></div></div>
<label class="slot"><input name="ativo" type="checkbox" value="true" th:checked="${cfg == null || cfg.ativo}"><span>Ativo para contratacao publica</span></label><button>Salvar plano</button></form></div>
<section class="panel"><h2>Planos ativos de clientes</h2><table><tr><th>Cliente</th><th>Telefone</th><th>Barbeiro</th><th>Valor</th><th>Limite</th><th>Inicio</th><th>Acoes</th></tr>
<tr th:each="p:${planosAtivos}"><td th:text="${p.cliente.nome}"></td><td th:text="${p.cliente.telefone}"></td><td th:text="${p.barbeiro.nome}"></td><td th:text="${'R$ ' + #numbers.formatDecimal(p.valorMensalSnapshot,1,'POINT',2,'COMMA')}"></td><td th:text="${p.cortesPorMesSnapshot + '/mes, ' + p.cortesPorSemanaSnapshot + '/semana'}"></td><td th:text="${#temporals.format(p.dataInicio,'dd/MM/yyyy')}"></td><td><form method="post" class="inline" th:action="@{/admin/mensalidades/clientes/{id}/cancelar(id=${p.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="danger">Cancelar</button></form></td></tr>
</table></section></main></body></html>
