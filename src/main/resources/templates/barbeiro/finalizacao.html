<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finalizar agendamento</title>
    <link rel="stylesheet" th:href="@{/css/barbeiro.css}">
    <script defer th:src="@{/js/barbeiro-finalizacao.js}"></script>
</head>
<body>
<main class="barber-shell finish-shell" id="finish-app" th:attr="data-api-url=${apiUrl}">
    <header class="finish-header">
        <a class="back-button" th:href="@{/barbeiro/agenda}" aria-label="Voltar para a agenda">‹</a>
        <h1>Finalizar agendamento</h1>
    </header>
    <p id="finish-loading" class="finish-notice" role="status">Carregando atendimento...</p>
    <div id="finish-error" class="finish-notice notice-error" role="alert" hidden></div>
    <button id="finish-retry" class="outline-button" type="button" hidden>Tentar novamente</button>
    <div id="finish-success" class="finish-notice notice-success" role="status" hidden>
        <strong>Atendimento finalizado!</strong>
        <p>O atendimento e a comissão foram registrados com sucesso.</p>
        <a class="outline-button" th:href="@{/barbeiro/agenda}">Voltar para a agenda</a>
    </div>
    <div id="finish-content" hidden>
        <section class="finish-panel client-summary" aria-labelledby="client-name">
            <div class="client-initials" id="client-initials" aria-hidden="true"></div>
            <div>
                <div class="client-title"><h2 id="client-name"></h2><span class="plan-tag" id="plan-tag" hidden>Mensal</span></div>
                <p id="appointment-date" class="subtitle"></p>
                <p id="appointment-hours" class="subtitle"></p>
            </div>
        </section>
        <div class="finish-panel attendance-state">
            <span class="attendance-check" aria-hidden="true">✓</span>
            <div><strong id="attendance-title">Atendimento</strong><p id="attendance-description"></p></div>
            <span class="status" id="attendance-status"></span>
        </div>
        <section class="commission-banner" aria-labelledby="commission-title">
            <div><h2 id="commission-title">Sua comissão</h2><p id="commission-description"></p></div>
            <strong id="commission-value"></strong>
        </section>
        <div class="finish-panel total-row"><div><strong>Valor a receber do cliente</strong><small id="charge-description"></small></div>
            <strong id="charge-value"></strong></div>
        <section class="finish-panel service-summary" aria-labelledby="services-title">
            <h2 id="services-title"><span aria-hidden="true">✂</span> Serviços do agendamento</h2>
            <ul id="service-list"></ul>
            <div class="services-total"><span>Total dos serviços</span><strong id="services-total"></strong></div>
        </section>
        <form id="finish-form">
            <fieldset class="payment-fieldset">
                <legend>Forma de pagamento</legend>
                <div id="payment-options" class="payment-options"></div>
            </fieldset>
            <p class="finish-hint" id="finish-hint" aria-live="polite"></p>
            <button id="finish-submit" class="primary-button finish-submit" type="submit" disabled>Finalizar atendimento</button>
        </form>
    </div>
    <noscript><p class="finish-notice">Ative o JavaScript para consultar e finalizar o atendimento.</p></noscript>
</main>
</body>
</html>
