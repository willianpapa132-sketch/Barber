<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha agenda</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header><div class="topnav"><span th:text="${barbeiro.nome}">Barbeiro</span><form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="secondary">Sair</button></form></div></header><main class="wrap"><h1>Minha agenda</h1><form method="get" class="actions"><input type="date" name="data" th:value="${data}"><button>Ver data</button></form><table><tr><th>Início</th><th>Fim</th><th>Cliente</th><th>Serviço</th><th>Status</th></tr><tr th:each="a:${agendamentos}"><td th:text="${#temporals.format(a.inicioEm,'HH:mm')}"></td><td th:text="${#temporals.format(a.fimEm,'HH:mm')}"></td><td th:text="${a.nomeCliente}"></td><td th:text="${a.nomeServicoSnapshot}"></td><td th:text="${a.status}"></td></tr></table><p class="muted" th:if="${#lists.isEmpty(agendamentos)}">Nenhum atendimento nesta data.</p></main></body></html>
