<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header>
    <div class="topnav">
        <strong>Barbearia</strong>
    </div>
</header>

<main class="wrap">
    <section class="panel auth-panel">
        <h1>Entrar</h1>

        <p th:if="${param.error}" class="msg err">Login ou senha invalidos.</p>
        <p th:if="${param.logout}" class="msg ok">Voce saiu do sistema.</p>
        <p id="login-error" class="msg err" hidden>Login ou senha invalidos.</p>

        <form id="login-form" th:action="@{/login}" method="post">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>

            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <div class="actions form-actions">
                <button type="submit">Entrar</button>
            </div>
        </form>
    </section>
</main>
<script>
    const form = document.getElementById('login-form');
    const error = document.getElementById('login-error');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.hidden = true;

        const response = await fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            credentials: 'same-origin',
            headers: { 'Accept': 'application/json' }
        });

        if (!response.ok) {
            error.hidden = false;
            return;
        }

        const data = await response.json();
        window.location.assign(data.redirectUrl);
    });
</script>
</body>
</html>
