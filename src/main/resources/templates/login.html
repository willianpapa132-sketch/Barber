<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<header><div class="topnav"><a href="/">Barbearia</a></div></header>
<main class="wrap"><section class="panel" style="max-width:420px;margin:auto"><h1>Entrar</h1>
<p class="err" th:if="${param.error}">Usuário ou senha inválidos, ou usuário inativo.</p>
<form method="post" th:action="@{/login}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label for="login">Usuário</label><input id="login" name="login" autocomplete="login" required>
<label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button style="margin-top:12px">Entrar</button>
</form></section></main></body></html>
